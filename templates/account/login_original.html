{% load socialaccount %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PSUSphere</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e8f1ff, #f7f9fc);
    }

    .login-card {
        width: 390px;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #0d6efd;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
    }

    h2 {
        text-align: center;
        margin: 0;
        color: #222;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin: 8px 0 28px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d5d9df;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .forgot {
        display: block;
        text-align: right;
        margin-top: -8px;
        margin-bottom: 18px;
        font-size: 13px;
        color: #0d6efd;
        text-decoration: none;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #0d6efd;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #0b5ed7;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 25px 0;
        color: #999;
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #ddd;
    }

    .social-btn {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 11px;
        margin-bottom: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
        color: #333;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .social-btn:hover {
        background: #f7f7f7;
    }

    .google-icon {
        color: #4285f4;
        font-weight: bold;
    }

    .github-icon {
        color: #24292f;
        font-weight: bold;
    }

    .register {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #777;
    }

    .register a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: bold;
    }

    .error {
        background: #ffe5e5;
        color: #c62828;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 18px;
        font-size: 13px;
    }
</style>


</head>

<body>

<div class="login-card">


<div class="logo">P</div>

<h2>Welcome Back</h2>

<div class="subtitle">
    Sign in to your PSUSphere account
</div>

{% if form.errors %}
    <div class="error">
        Invalid username/email or password.
    </div>
{% endif %}

<form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_login">Username or Email</label>
        <input
            type="text"
            name="login"
            id="id_login"
            placeholder="Enter your username or email"
            required
        >
    </div>

    <div class="form-group">
        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Enter your password"
            required
        >
    </div>

    <a href="{% url 'account_reset_password' %}" class="forgot">
        Forgot password?
    </a>

    <button type="submit" class="login-btn">
        Login
    </button>
</form>

<div class="divider">
    OR
</div>

<a
    href="{% provider_login_url 'google' %}"
    class="social-btn"
>
    <span class="google-icon">G</span>
    Continue with Google
</a>

<a
    href="{% provider_login_url 'github' %}"
    class="social-btn"
>
    <span class="github-icon">●</span>
    Continue with GitHub
</a>

<div class="register">
    Don't have an account?
    <a href="{% url 'account_signup' %}">Create an account</a>
</div>


</div>

</body>
</html>
